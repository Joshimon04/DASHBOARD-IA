<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard IA</title>

    <!-- Librería para leer Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #150f24, #2b1747);
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #c7b5e8;
            margin-bottom: 40px;
        }

        .tarjeta {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 35px 60px;
            backdrop-filter: blur(10px);
        }

        .numero {
            font-size: 60px;
            font-weight: bold;
            color: #c89cff;
        }

        .texto {
            font-size: 18px;
            color: #ddd;
        }

        #estado {
            margin-top: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Adopción de Inteligencia Artificial</h1>

        <div class="subtitulo">
            Dashboard interactivo de estudiantes universitarios
        </div>

        <div class="tarjeta">

            <div id="cantidad" class="numero">
                ...
            </div>

            <div class="texto">
                Respuestas analizadas
            </div>

        </div>

        <div id="estado">
            Cargando base de datos...
        </div>

    </div>


    <script>

        fetch("encuestas.xlsx")

            .then(respuesta => respuesta.arrayBuffer())

            .then(datos => {

                const workbook = XLSX.read(datos, {
                    type: "array"
                });

                const hoja = workbook.Sheets["Datos"];

                const encuesta = XLSX.utils.sheet_to_json(hoja);

                document.getElementById("cantidad").textContent =
                    encuesta.length;

                document.getElementById("estado").textContent =
                    "Base de datos cargada correctamente";

                console.log(encuesta);

            })

            .catch(error => {

                console.error(error);

                document.getElementById("estado").textContent =
                    "Error al cargar la base de datos";

            });

    </script>

</body>

</html>
